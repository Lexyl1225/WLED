<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta content='width=device-width' name='viewport'>
		<meta name="theme-color" content="#222222">
		<title>Welcome!</title>
		<style>
			body {
				font-family: Verdana, Helvetica, sans-serif;
				text-align: center;
				background-color: #222;
				margin: 0;
				color: #fff;
			}
	
			button {
				outline: none;
				cursor: pointer;
				padding: 8px;
				margin: 10px;
				width: 230px;
				text-transform: uppercase;
				font-family: helvetica;
				font-size: 19px;
				background-color: #333;
				color: white;
				border: 0px solid white;
				border-radius: 25px;
			}

			img {
				width: 950px;
				max-width: 82%;
				image-rendering: pixelated;
				image-rendering: crisp-edges;
				margin: 4vh 0 0 0;
				animation: fi 1s;
			}
			
			@keyframes fi {
				from { opacity: 0; }
				to   { opacity: 1; }
			}
	
			.main {
				animation: fi 1.5s .7s both;
			}
		</style>
		<style id="devBannerStyle">
			#devBanner {
				position: relative;
				z-index: 1;
				overflow: hidden;
				background: #222;
				color: #fff;
				font: bold 11px/24px Helvetica, Verdana, sans-serif;
				letter-spacing: .5px;
				text-align: center;
				padding: 0 6px;
				text-shadow: 0 1px 2px rgba(0,0,0,.85), 0 0 6px rgba(0,0,0,.5);
			}
			/* AI: below section was generated by an AI */
			/* RGB band drifting left to right (see index.css #devBanner) */
			#devBanner::before, #devBanner::after {
				content: "";
				position: absolute;
				top: 0;
				bottom: 0;
				z-index: -1;
				pointer-events: none;
			}
			#devBanner::before {
				left: -600px;
				right: 0;
				background: repeating-linear-gradient(90deg, hsl(0,85%,48%) 0, hsl(60,85%,42%) 100px, hsl(120,75%,38%) 200px, hsl(180,85%,38%) 300px, hsl(240,85%,55%) 400px, hsl(300,80%,48%) 500px, hsl(0,85%,48%) 600px);
				animation: dbRgb 12s linear infinite;
			}
			#devBanner::after {
				left: 0;
				width: 25%;
				background: linear-gradient(90deg, transparent, rgba(255,255,255,.28), transparent);
				animation: dbSheen 7s ease-in-out infinite;
			}
			@keyframes dbRgb { from { transform: translateX(0); } to { transform: translateX(600px); } }
			@keyframes dbSheen { from { transform: translateX(-100%); } to { transform: translateX(400%); } }
			@media (prefers-reduced-motion: reduce) {
				#devBanner::before, #devBanner::after { animation: none; }
			}
			/* AI: end */
		</style>
	</head>
